# Dependabot raises pull requests only for known security advisories.
#
# Version-bump PRs were disabled after a batch of eight: three broke the build
# on genuine incompatibilities and the rest sat red. A queue of failing PRs that
# nobody reads is worse than none, because the advisory that matters is lost in
# it. `open-pull-requests-limit: 0` disables version updates while leaving
# security updates, which ignore this setting, switched on.
version: 2
updates:
  - package-ecosystem: npm
    directory: /cdk
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    groups:
      cdk-dependencies:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    groups:
      frontend-dependencies:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    groups:
      backend-dependencies:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
