# Dependabot keeps dependencies current and raises pull requests for known
# advisories. Grouped so a week's updates arrive as one review rather than ten.
version: 2
updates:
  - package-ecosystem: npm
    directory: /cdk
    schedule:
      interval: weekly
    groups:
      cdk-dependencies:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-dependencies:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
