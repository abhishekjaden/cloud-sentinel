name: Smoke test

# Not run on every push: the API stack is deployed on demand and torn down
# between sessions, so an automatic run would fail for reasons unrelated to the
# commit. Trigger this after a deployment.
on:
  workflow_dispatch:
    inputs:
      dashboard:
        description: Dashboard URL to test
        required: false
        default: https://d2tb90osqfrb0m.cloudfront.net

permissions:
  contents: read

jobs:
  smoke:
    name: Verify the deployed system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run smoke test
        run: python scripts/smoke_test.py --dashboard "${{ inputs.dashboard }}"
