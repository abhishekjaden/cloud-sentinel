name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Required for GitHub to mint the OIDC token AWS verifies.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  CI_ROLE: arn:aws:iam::062345618950:role/CloudSentinelGitHubCiRole

jobs:
  infrastructure:
    name: Infrastructure (CDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - name: Install CDK dependencies
        run: npm ci

      # DashboardStack bundles frontend/dist as an S3 asset, so the SPA must be
      # built before the CDK app can be synthesized.
      - name: Build frontend for asset bundling
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Type check
        run: npx tsc --noEmit

      - name: Security posture tests
        run: npx jest --ci

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.CI_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cloudsentinel-ci-${{ github.run_id }}

      - name: Synthesize all stacks
        run: npx cdk synth --quiet

      - name: Diff against deployed state
        run: npx cdk diff --all || true

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Type check and build
        run: npm run build

  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Byte-compile application
        run: python -m compileall -q app

      - name: Unit tests with coverage
        run: python -m pytest
        env:
          AWS_REGION: us-east-1
          COGNITO_USER_POOL_ID: us-east-1_testpool
          COGNITO_CLIENT_ID: test-client-id
          AUTH_ENABLED: 'true'
