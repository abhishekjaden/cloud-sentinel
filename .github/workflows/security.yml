name: Security

# Run from CI on every push and pull request (ci.yml calls this workflow), so
# that a finding fails CI and the deploy that follows CI does not happen. It
# used to run beside CI instead, and nothing depended on it: a Semgrep finding
# left it red for days in October 2026 while deploys went on, unseen until a
# screenshot of the Actions list (docs/well-architected-review.md has the
# span). A control nobody has to pass is not one.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Weekly sweep: advisories and secret patterns change even when the code
    # does not, so a scan that only runs on commit will miss new findings.
    - cron: '0 6 * * 1'

# Only reading the checkout: neither scanner uploads to code scanning, and a
# called workflow may hold no permission its caller's workflow lacks — asking
# for security-events: write here failed CI's first two runs with the gate.
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # gitleaks inspects history, not just the tip

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      # A pinned release rather than the semgrep/semgrep container's floating
      # tag: the scanner's version changed under this workflow once, and with it
      # the form of the rule ids an inline suppression has to name.
      - name: Install Semgrep
        run: pip install semgrep==1.181.0

      - name: Scan for insecure patterns
        # Actions are pinned to commit SHAs above; Dependabot updates the pins.
        run: >
          semgrep scan
          --config=p/default --config=p/python --config=p/typescript --config=p/secrets
          --error --skip-unknown-extensions

  dependencies:
    name: Dependency audit (pip-audit, npm audit)
    runs-on: ubuntu-latest
    # Added 25 October 2026, when the manifests were found carrying published
    # advisories — 28 in the infrastructure's lockfile, 42 in the console's,
    # 51 in the backend's pins, 37 of them Pillow's — with no pull request
    # raised for any: Dependabot's security updates depend on a repository
    # setting, and this gate does not. It reads the versions the manifests
    # pin, which are the versions the project chooses.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Python — the API image's pins and the test suite's
        # Two advisories have no fixed release and are unreachable here; each
        # is ignored by id, with its reason in docs/threat-model.md (B2, S):
        # PYSEC-2026-4298, python-jose's HMAC key check, needs HS256 and a raw
        # key, and the API accepts RS256 alone with a JWK (pinned by a test);
        # PYSEC-2026-1325, ecdsa's timing attack, needs ECDSA signing, which
        # the API never does. Both files are named: with --no-deps the
        # "-r requirements.txt" inside the second is not followed.
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r backend/requirements.txt -r backend/requirements-dev.txt --no-deps --disable-pip \
            --vulnerability-service pypi \
            --ignore-vuln PYSEC-2026-4298 --ignore-vuln PYSEC-2026-1325

      - name: npm — the infrastructure and the console, high and critical
        run: |
          npm audit --prefix cdk --audit-level=high
          npm audit --prefix frontend --audit-level=high
