name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly sweep: advisories and secret patterns change even when the code
    # does not, so a scan that only runs on commit will miss new findings.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks inspects history, not just the tip

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Scan for insecure patterns
        # Action tags are managed by Dependabot on a weekly cadence with a
        # seven-day cooldown, so mutable-tag findings are excluded rather than
        # pinning ten SHAs by hand and defeating those updates.
        run: >
          semgrep scan
          --config=p/default --config=p/python --config=p/typescript --config=p/secrets
          --exclude-rule=yaml.github-actions.security.third-party-action-not-pinned-to-commit-sha.third-party-action-not-pinned-to-commit-sha
          --error --skip-unknown-extensions
